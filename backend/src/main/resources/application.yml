spring:
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  application:
    name: hitoFinal
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  upload:
    dir: ./uploads

# Configuración de tokens JWT para autenticación.
# El secreto debe tener al menos 32 bytes en Base64 (HS256).
jwt:
  secret: ${JWT_SECRET}
  access-token:
    expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-token:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  cookie-secure: ${JWT_COOKIE_SECURE:false}

# Aislamiento hermético: la documentación queda bloqueada por defecto.
# Solo el perfil "dev" habilita Swagger-UI y OpenAPI (application-dev.yml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

